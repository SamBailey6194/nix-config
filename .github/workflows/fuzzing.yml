name: Continuous Fuzzing

on:
  push:
    branches: [main, feature/*]
    paths:
      - 'rust/**'
      - '.github/workflows/fuzzing.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rust/**'
  schedule:
    # Run fuzzing daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: 'Fuzzing duration in seconds'
        required: false
        default: '300'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C instrument-coverage"

jobs:
  fuzz-quick:
    name: Quick Fuzzing (PR Check)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_secret_name_validation
          - fuzz_wireguard_validation
          - fuzz_mullvad_relay_parsing
          - fuzz_wireguard_config_generation
          - fuzz_malware_heuristics
          - fuzz_path_validation

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Cache fuzzing corpus
        uses: actions/cache@v4
        with:
          path: rust/fuzz/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Run fuzzing (1 minute)
        working-directory: rust/fuzz
        run: |
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -print_final_stats=1
        continue-on-error: true

      - name: Check for crashes
        working-directory: rust/fuzz
        run: |
          if [ -d "artifacts/${{ matrix.target }}" ]; then
            echo "::error::Fuzzing found crashes in ${{ matrix.target }}"
            ls -la artifacts/${{ matrix.target }}
            exit 1
          fi

  fuzz-extended:
    name: Extended Fuzzing (Scheduled)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_secret_name_validation
          - fuzz_wireguard_validation
          - fuzz_mullvad_relay_parsing
          - fuzz_wireguard_config_generation
          - fuzz_malware_heuristics
          - fuzz_path_validation

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Cache fuzzing corpus
        uses: actions/cache@v4
        with:
          path: rust/fuzz/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Run fuzzing (extended)
        working-directory: rust/fuzz
        env:
          FUZZ_TIME: ${{ github.event.inputs.fuzz_time || '3600' }}
        run: |
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=$FUZZ_TIME \
            -print_final_stats=1 \
            -print_pcs=1 \
            -print_coverage=1

      - name: Minimize corpus
        working-directory: rust/fuzz
        run: |
          cargo fuzz cmin ${{ matrix.target }}

      - name: Check for crashes
        working-directory: rust/fuzz
        run: |
          if [ -d "artifacts/${{ matrix.target }}" ]; then
            echo "::error::Fuzzing found crashes in ${{ matrix.target }}"
            ls -la artifacts/${{ matrix.target }}

            # Upload crash artifacts
            mkdir -p /tmp/crashes
            cp -r artifacts/${{ matrix.target }}/* /tmp/crashes/

            exit 1
          fi

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: /tmp/crashes

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-coverage-${{ matrix.target }}
          path: rust/fuzz/coverage

  fuzz-sanitizer:
    name: Fuzzing with Sanitizers
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, memory, undefined]
        target:
          - fuzz_secret_name_validation
          - fuzz_wireguard_validation

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run fuzzing with ${{ matrix.sanitizer }} sanitizer
        working-directory: rust/fuzz
        env:
          RUSTFLAGS: "-Z sanitizer=${{ matrix.sanitizer }}"
        run: |
          cargo fuzz run ${{ matrix.target }} \
            --sanitizer ${{ matrix.sanitizer }} \
            -- -max_total_time=600

      - name: Check for issues
        working-directory: rust/fuzz
        run: |
          if [ -d "artifacts/${{ matrix.target }}" ]; then
            echo "::error::${{ matrix.sanitizer }} sanitizer found issues in ${{ matrix.target }}"
            exit 1
          fi
