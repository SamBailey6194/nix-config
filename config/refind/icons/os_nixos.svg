  <!-- Build badge: flake commit and NixOS generation, e.g. "87eb3c0 · 5".
       Nix fills flake-rev at build time (self.shortRev, with a "*" when the
       tree was dirty, or the build date for path: builds that carry no Git
       revision). The rEFInd installer fills generation at switch time, then
       resizes the pill around the text (12px per glyph at font-size 20). -->
  <g filter="url(#sh)">
    <rect id="build-badge" x="54" y="212" width="148" height="36" rx="18" fill="#1a1a1a" fill-opacity=".92" stroke="url(#badge)" stroke-width="3"/>
    <text id="build-badge-text" x="128" y="236.5" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="20" fill="#e6e6e6"><tspan id="flake-rev">87eb3c0</tspan><tspan fill="#595959"> · </tspan><tspan fill="#ffb454">#</tspan><tspan id="generation">5</tspan></text>
  </g>
