# vulnix whitelist for `just audit-cves`: false positives only.
#
# vulnix matches NVD product names and versions against Nix package names, so
# unrelated products collide (TeX Live's `moodle`, `notes` and `python`
# packages, the Jenkins Git plugin vs git, KiTTY vs kitty, other products
# called "storage manager"). Every entry was checked on 2026-10-16 against NVD
# and the nixpkgs derivation of the running system (nixpkgs 55bfb4d).
#
# Never list a real CVE here, even a patched one: a CVE that applies but is
# patched is hidden from vulnix by the patch file name or not at all, and is
# reviewed from the scan output instead. vulnix hides each listed CVE on its
# own; a package with other CVEs still shows, and prints the section's comment
# beside those remaining CVEs. So when a package also has real CVEs (openssl,
# ffmpeg, gimp...), the comment must start "Whitelists <CVE> only:" so it is
# not read as explaining them. Versioned sections expire with the version;
# re-check the pname-only ones when the product they collide with changes.
#
# Syntax: https://github.com/nix-community/vulnix#whitelisting

# ---- Wrong platform ----
["openssl-3.5.8"]
cve = ["CVE-2026-54875"]
comment = "Whitelists CVE-2026-54875 only: SM2 timing on ARM64/RISC-V, host is x86_64"

["cjson"]
cve = ["CVE-2026-16554"]
comment = "Whitelists CVE-2026-16554 only: 32-bit size_t, host is x86_64"

