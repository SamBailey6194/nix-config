# Hyprland Base Configuration
# Core settings shared across all devices

# Modifier key
$mod = SUPER

# Environment variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# General window settings
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Ayu Dark colors
    col.active_border = rgba(ffb454ee) rgba(59c2ffee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = true
    allow_tearing = false

    layout = dwindle
}

# Layout: Dwindle
dwindle {
    pseudotile = true
    preserve_split = true
}

# Layout: Master
master {
    new_status = master
}

# Misc settings
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}
