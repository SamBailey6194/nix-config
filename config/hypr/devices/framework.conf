# Device-specific Hyprland configuration for framework
# User: sam-framework
# Hardware: AMD Ryzen + Radeon, 64GB RAM
# Software: DaVinci Resolve Studio, Affinity Apps

# Monitor configuration
# Framework laptop display with high DPI scaling
monitor = eDP-1,preferred,auto,1.25

# AMD GPU optimizations
env = WLR_DRM_NO_ATOMIC,1  # Helps with some AMD GPU issues

# High-performance settings for creative work
decoration {
    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.2
    }
}

# Framework-specific window rules
# DaVinci Resolve: maximize on workspace 5
windowrulev2 = workspace 5, class:^(resolve)$
windowrulev2 = fullscreen, class:^(resolve)$

# Affinity apps: assign to specific workspaces
windowrulev2 = workspace 4, class:^(affinity-photo)$
windowrulev2 = workspace 4, class:^(affinity-designer)$
windowrulev2 = workspace 4, class:^(affinity-publisher)$

# Framework-specific autostart
exec-once = brightnessctl set 60%  # Set initial brightness to 60%
# exec-once = resolve  # Uncomment to auto-start DaVinci Resolve
