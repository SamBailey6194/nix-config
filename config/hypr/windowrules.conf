# Window Rules Configuration
# Floating, opacity, and workspace rules for specific applications

# ── Float Rules ───────────────────────────────────────────────────────

windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(qpwgraph)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(org.rustdesk.rustdesk)$, float on

# ── Opacity Rules ─────────────────────────────────────────────────────

windowrule = match:class ^(kitty)$, opacity 0.95 0.95
windowrule = match:class ^(thunar)$, opacity 0.95 0.95

# ── Workspace Assignments ─────────────────────────────────────────────

# Communication (workspace 9)
windowrule = match:class ^(teams-for-linux)$, workspace 9
windowrule = match:class ^(zoom)$, workspace 9
windowrule = match:class ^(discord)$, workspace 9

# Affinity Suite (workspace 4)
windowrule = match:class ^(affinity-designer)$, workspace 4
windowrule = match:class ^(affinity-photo)$, workspace 4
windowrule = match:class ^(affinity-publisher)$, workspace 4
