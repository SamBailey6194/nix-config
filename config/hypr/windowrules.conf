# Window Rules Configuration
# Floating, opacity, and workspace rules for specific applications

# Float certain windows
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(qpwgraph)$
windowrulev2 = float, class:^(nm-connection-editor)$

# Opacity rules
windowrulev2 = opacity 0.95 0.95, class:^(kitty)$
windowrulev2 = opacity 0.95 0.95, class:^(thunar)$

