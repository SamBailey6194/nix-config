# Window Rules Configuration
# Floating, opacity, and workspace rules for specific applications

# Float certain windows
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(qpwgraph)$
windowrule = float, class:^(nm-connection-editor)$

# Opacity rules
windowrule = opacity 0.95 0.95, class:^(kitty)$
windowrule = opacity 0.95 0.95, class:^(thunar)$

# Workspace rules (example - assign specific apps to workspaces)
# windowrule = workspace 2, class:^(firefox)$
# windowrule = workspace 3, class:^(code)$
# windowrule = workspace 9, class:^(discord)$
