# Hyprland Configuration - Base
# This is the main configuration file that includes all modular configs
# Device-specific overrides are in separate files

# Source modular configuration files
source = ~/.config/hypr/base.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/appearance.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/autostart.conf

# Device-specific overrides (optional)
# Uncomment the appropriate line for your device:
# source = ~/.config/hypr/devices/laptop-intel.conf
# source = ~/.config/hypr/devices/framework.conf
# source = ~/.config/hypr/devices/devtower.conf
