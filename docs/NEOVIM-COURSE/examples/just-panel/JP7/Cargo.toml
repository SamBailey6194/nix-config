# Mini copy of rust/Cargo.toml for the just-panel worked examples: the same
# [workspace.package], and only the [workspace.dependencies] just-panel uses.
# In the real file, "just-panel" goes on its own line after "dev-layout".
[workspace]
members = [
    "just-panel",        # TUI control panel for the justfile
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sam Bailey <sam.bailey@sambailey.dev>"]
license = "MIT"

[workspace.dependencies]
# CLI and terminal
clap = { version = "4.5", features = ["derive", "cargo"] }
ratatui = "0.30"

# Process execution
signal-hook = "0.3"

# Error handling
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
