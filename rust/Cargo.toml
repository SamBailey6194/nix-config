[workspace]
members = [
    "secrets-verify",
    "agenix-helper",
    # "security-wrapper",  # Phase 10 - Future security wrapper for OpenBao
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sam Bailey <sam.bailey@sambailey.dev>"]
license = "MIT"

[workspace.dependencies]
# CLI and terminal
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# File system and paths
walkdir = "2.5"
dirs = "5.0"

# Process execution
which = "6.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# SSH and crypto (for future use)
ssh2 = "0.9"
