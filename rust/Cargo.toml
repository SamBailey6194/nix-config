[workspace]
members = [
    "secrets-verify",
    "agenix-helper",
    "wireguard-helper",  # Phase 6 - Mullvad VPN management
    "malware-scanner",   # Phase 7 - Malware scanning and threat protection
    # "security-wrapper",  # Phase 10 - Future security wrapper for OpenBao
]
exclude = [
    "fuzz",  # Fuzzing workspace (separate - uses cargo-fuzz)
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sam Bailey <sam.bailey@sambailey.dev>"]
license = "MIT"

[workspace.dependencies]
# CLI and terminal
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# File system and paths
walkdir = "2.5"
dirs = "5.0"

# Process execution
which = "6.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# SSH and crypto (for future use)
ssh2 = "0.9"

# HTTP client (for Mullvad API)
reqwest = { version = "0.11", features = ["json", "blocking"] }

# Date/time handling (for cache TTL and metrics)
chrono = { version = "0.4", features = ["serde"] }

# Random number generation (for relay selection)
rand = "0.8"

# System interaction (for cgroups and process management)
nix = { version = "0.27", features = ["process", "user"] }
libc = "0.2"

# Additional dependencies for malware-scanner
uuid = { version = "1.7", features = ["v4", "serde"] }
notify-rust = "4.10"
